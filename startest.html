<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MILE 별자리 테스트 — 나의 기숙사 별자리 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600&display=swap">
<style>
/* ===== 기본 · MILE 별자리 테마 ===== */
:root{--lav:#a0a9ef;--muted:#a7aabd;--ink:#f3f1eb;--gold:#f4df93}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#080b19}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Noto Sans KR",sans-serif;
 background:radial-gradient(circle at 78% 4%,rgba(121,132,220,.14),transparent 30%),radial-gradient(circle at 10% 40%,rgba(151,132,216,.08),transparent 28%),linear-gradient(180deg,#0b0e22 0%,#19182f 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.4;
 background-image:radial-gradient(circle at 12% 18%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 77% 28%,rgba(255,255,255,.8) 0 1px,transparent 1.5px),radial-gradient(circle at 42% 72%,rgba(255,255,255,.7) 0 1px,transparent 1.5px);
 background-size:310px 270px,390px 330px,270px 310px;animation:skyDrift 180s linear infinite}
@keyframes skyDrift{to{background-position:-620px 270px,-780px 330px,-540px 310px}}
button{font:inherit;cursor:pointer}
a{color:inherit}
.nav{position:sticky;top:0;z-index:10;height:74px;padding:0 5.5vw;display:flex;align-items:center;justify-content:space-between;background:rgba(8,11,25,.78);backdrop-filter:blur(18px);border-bottom:1px solid rgba(203,210,255,.10)}
.nav img{width:104px;height:auto;display:block}
.nav-home{color:#c8cbe0;font-size:14px;text-decoration:none}
.nav-home:hover{color:#fff}
.section{padding:90px 6vw 110px}
.label{font-size:12px;letter-spacing:2px;font-weight:700;color:#aab2ff}
.primary{border:0;background:var(--lav);color:#11162d;padding:15px 22px;border-radius:999px;box-shadow:0 10px 30px rgba(121,133,232,.2);transition:background .2s,transform .2s}
.primary:hover{background:#c0c7ff;transform:translateY(-2px)}
.hero-primary span{margin-left:13px;font-size:16px}
.textbtn{border:0;background:none;color:#b5bcf3;padding:12px 2px}
.textbtn:hover{color:#fff}
.footer{padding:40px 6vw 50px;color:#6e748e;font-size:12px;text-align:center}
.footer a{color:#aab2ff}
@media(max-width:600px){.section{padding:56px 18px 80px}}

/* ===== MILE 기숙사 별자리 테스트 ===== */
.st-wrap{max-width:760px;margin:0 auto}
.st-card{padding:40px 36px;border-radius:28px;border:1px solid rgba(207,214,255,.11);background:radial-gradient(circle at 80% 0%,rgba(150,145,220,.16),transparent 40%),linear-gradient(145deg,#111120,#1c1b30 60%,#24213b);color:#f1efe8;box-shadow:0 25px 60px rgba(0,0,0,.25)}
.st-intro{text-align:center}
.st-intro h2{font-family:"Noto Serif KR",serif;font-size:clamp(30px,5vw,44px);font-weight:400;letter-spacing:-1.5px;margin:12px 0;color:#f4f1ea}
.st-intro p{color:#a7aabd;line-height:1.8}
.st-intro .st-svg{width:220px;display:block;margin:6px auto 4px}
.st-progress{display:flex;gap:6px;margin-bottom:28px}
.st-progress span{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.08)}
.st-progress span.on{background:linear-gradient(90deg,#8881cf,#d5d0ff);box-shadow:0 0 10px rgba(180,170,255,.4)}
.st-axis{font-size:11px;letter-spacing:2px;color:#aab2ff}
.st-q{font-size:22px;font-weight:500;line-height:1.5;margin:12px 0 26px;word-break:keep-all;color:#fff}
.st-opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-bottom:12px;padding:18px 20px;border-radius:16px;border:1px solid rgba(207,214,255,.14);background:rgba(255,255,255,.03);color:#e7e3ff;font-size:15px;line-height:1.5;word-break:keep-all;transition:.2s}
.st-opt:hover{border-color:#8f99e7;background:rgba(154,164,238,.1);transform:translateY(-2px)}
.st-opt b{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(154,164,238,.18);color:#c5ccff;font-size:12px}
.st-back{border:0;background:none;color:#88849f;font-size:13px;margin-top:8px;padding:0}
.st-back:hover{color:#fff}
.st-svg{overflow:visible}
.st-svg line{stroke:rgba(200,195,255,.6);stroke-width:1.2;stroke-dasharray:200;stroke-dashoffset:200;animation:stDraw 1.4s ease forwards}
.st-svg circle{fill:#e7e3ff;filter:drop-shadow(0 0 4px rgba(200,195,255,.9))}
.st-svg circle.gold{fill:#f4df93;filter:drop-shadow(0 0 7px rgba(244,223,147,.95))}
@keyframes stDraw{to{stroke-dashoffset:0}}
.st-result{border-radius:28px;overflow:hidden;border:1px solid rgba(207,214,255,.11);box-shadow:0 25px 60px rgba(0,0,0,.3)}
.st-sky{padding:36px 30px 32px;text-align:center;color:#fff}
.st-sky.dawn{background:radial-gradient(circle at 50% 120%,rgba(255,214,180,.45),transparent 55%),linear-gradient(180deg,#232650 0%,#4d4c86 65%,#a98aa8 100%)}
.st-sky.night{background:radial-gradient(circle at 80% 10%,rgba(150,145,220,.25),transparent 35%),linear-gradient(180deg,#05071a 0%,#141936 100%)}
.st-sky .label{color:#d5d0ff}
.st-sky .st-svg{width:min(320px,100%);display:block;margin:10px auto 6px}
.st-mod{color:#f4df93;font-size:14px;letter-spacing:4px}
.st-sky h2{font-family:"Noto Serif KR",serif;font-size:42px;font-weight:500;margin:4px 0 6px;color:#fff;letter-spacing:-1px}
.st-tagline{margin:0;color:#e4e2f4 !important;font-size:15px}
.st-code{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:18px}
.st-code span{font-size:11px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff}
.st-body{padding:32px 36px 36px;background:linear-gradient(145deg,#10162d,#0d1328);color:#f1efe8}
.st-body h4{margin:28px 0 10px;font-size:12px;letter-spacing:2px;color:#aab2ff;font-weight:600}
.st-body h4:first-child{margin-top:0}
.st-body p{margin:0;color:#b4b7cb;line-height:1.85;font-size:14px;word-break:keep-all}
.st-mate{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(207,214,255,.08)}
.st-mate .st-svg{width:96px;flex:0 0 96px}
.st-mate b{display:block;margin-bottom:4px;color:#fff}
.st-pills{display:flex;flex-wrap:wrap;gap:8px}
.st-pills span{font-size:12px;padding:7px 12px;border-radius:99px;border:1px solid rgba(170,163,255,.3);color:#d8d6ff}
.st-pills span:before{content:"✦ ";color:#f4df93}
.st-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:28px}
.st-note{margin-top:16px !important;font-size:12px !important;color:#f4df93 !important}
.st-tally{margin-top:34px;padding-top:24px;border-top:1px solid rgba(207,214,255,.1);text-align:left}
.st-tally-head{display:flex;justify-content:space-between;font-size:12px;color:#a7aabd;margin-bottom:12px}
.st-tally-head b{color:#f4df93}
.st-tally-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st-tally-grid div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);display:flex;justify-content:space-between;font-size:12px;color:#c8cbe0}
.st-tally-grid b{color:#fff}
.st-reset{border:0;background:none;color:#6f7590;font-size:11px;margin-top:10px;padding:0}
@media(max-width:600px){
 .st-card,.st-body{padding:26px 20px}
 .st-q{font-size:19px}
 .st-sky h2{font-size:32px}
 .st-tally-grid{grid-template-columns:repeat(2,1fr)}
 .st-mate{flex-direction:column;align-items:flex-start}
}
</style>
</head>

    tip: '대청소는 위에서 아래로, 마른 청소 다음에 물청소 순서로 하면 같은 곳을 두 번 닦지 않아도 돼요.',
    kit: 'refill', preset: { all: false, items: { '매직블럭 4입': 1, '하수구 발포 세정제 12정': 1, '배수구 망 30매': 1, '수세미 3입': 1 } },
    points: [[58,14],[142,20],[84,60],[100,63],[116,66],[54,110],[146,106]], lines: [[0,2],[1,4],[2,3],[3,4],[2,5],[4,6]], gold: 0
  },
  MVP: {
    name: '페가수스자리', tagline: '물건도 에너지도 넘치는 수집가',
    desc: '좋아하는 물건이 많고, 필요할 것 같은 건 미리 사 두는 타입이에요. 방이 금세 채워지지만 그만큼 개성도 가득해요. 청소는 한 번에 몰아서 하는 편이에요.',
    mate: 'QVP', mateWhy: '카시오페이아와는 물건을 꺼내 두는 스타일이 같아서 서로의 방식을 이해해요. 카시오페이아의 빠른 손이 정리 타이밍을 잡아 줄 거예요.',
    tip: '물건이 많을수록 자주 쓰는 것만 눈에 보이게 두고, 나머지는 상자 하나에 모아 두면 공간이 훨씬 넓어 보여요.',
    kit: 'custom', preset: { all: true, items: { '무타공 후크 4개': 1, '옷걸이 10개 세트': 1 } },
    points: [[50,32],[130,30],[132,100],[52,98],[182,10]], lines: [[0,1],[1,2],[2,3],[3,0],[1,4]], gold: 4
  },
  MVN: {
    name: '물병자리', tagline: '자유로운 영혼, 위기에 강한 해결사',
    desc: '정해진 틀보다 흐름을 따르는 타입이에요. 챙기는 건 감으로 하지만, 갑작스러운 상황에서 누구보다 빨리 방법을 찾아내요.',
    mate: 'MJN', mateWhy: '오리온자리와는 둘 다 몰아서 하는 리듬이 같아서 대청소 날을 맞추기 쉬워요. 오리온의 제자리 습관이 방을 지켜 줄 거예요.',
    tip: '갑자기 단추가 떨어지거나 옷이 뜯어졌을 때는 미니 바늘 세트 하나로 대부분 해결돼요. 벌레 퇴치제는 문틈과 창틀 위주로 두세요.',
    kit: 'custom', preset: { all: true, items: { '미니 바늘 세트': 1 } },
    points: [[18,30],[58,52],[92,28],[122,62],[152,44],[180,92]], lines: [[0,1],[1,2],[2,3],[3,4],[4,5]], gold: 2
  }
};

const starTime = {
  dawn: '여기에 아침형이라 샤워실이 붐비기 전에 하루 준비를 끝내요. 소등 후 조용한 환경이 중요하니 룸메이트들과 수면 시간을 미리 이야기해 두면 좋아요.',
  night: '여기에 밤형이라 소등 이후에 집중력이 살아나요. 스탠드 밝기나 소리 규칙을 룸메이트와 미리 정해 두면 서로 편해요.'
};

let stStep = 0, stAnswers = [], stLast = null;
const stArea = () => document.getElementById('starTestArea');

function stSVG(t) {
  const lines = t.lines.map(([i, j], n) =>
    `<line x1="${t.points[i][0]}" y1="${t.points[i][1]}" x2="${t.points[j][0]}" y2="${t.points[j][1]}" style="animation-delay:${n * 0.15}s"></line>`).join('');
  const dots = t.points.map(([x, y], i) =>
    `<circle cx="${x}" cy="${y}" r="${i === t.gold ? 4.5 : 3}" class="${i === t.gold ? 'gold' : ''}"></circle>`).join('');
  return `<svg class="st-svg" viewBox="0 0 200 120" aria-hidden="true">${lines}${dots}</svg>`;
}

function stGetTally() { try { return JSON.parse(localStorage.getItem('mileStarTally') || '{}'); } catch (e) { return {}; } }
function stSaveTally(t) { try { localStorage.setItem('mileStarTally', JSON.stringify(t)); } catch (e) {} }
function resetStarTally() { if (confirm('부스 참여 기록을 초기화할까요?')) { stSaveTally({}); renderStarTest(); } }

function renderStarTest() {
  const tally = stGetTally();
  const total = Object.values(tally).reduce((s, n) => s + n, 0);
  stArea().innerHTML = `
    <div class="st-card st-intro">
      <div class="label">MILE CONSTELLATION TEST</div>
      <h2>나의 기숙사 별자리 찾기</h2>
      ${stSVG(starTypes.QJP)}
      <p>8개의 질문으로 알아보는 나의 생활 별자리.<br>나에게 꼭 맞는 첫걸음 키트도 함께 추천해 드려요.</p>
      <div class="st-actions" style="justify-content:center">
        <button class="primary hero-primary" onclick="startStarTest()">테스트 시작하기 <span>✦</span></button>
      </div>
      <div class="st-tally">
        <div class="st-tally-head"><span>오늘 이 부스의 밤하늘</span><b>${total}명 참여</b></div>
        <div class="st-tally-grid">${Object.keys(starTypes).map(k => `<div><span>${starTypes[k].name}</span><b>${tally[k] || 0}</b></div>`).join('')}</div>
        <button class="st-reset" onclick="resetStarTally()">기록 초기화</button>
      </div>
    </div>`;
}

function startStarTest() { stStep = 0; stAnswers = []; renderStarQ(); }

function renderStarQ() {
  const q = starQuestions[stStep];
  stArea().innerHTML = `
    <div class="st-card">
      <div class="st-progress">${starQuestions.map((_, i) => `<span class="${i <= stStep ? 'on' : ''}"></span>`).join('')}</div>
      <div class="st-axis">Q${stStep + 1} / ${starQuestions.length} · ${q.axis}</div>
      <div class="st-q">${q.q}</div>
      <button class="st-opt" onclick="answerStar('a')"><b>A</b><span>${q.a}</span></button>
      <button class="st-opt" onclick="answerStar('b')"><b>B</b><span>${q.b}</span></button>
      <button class="st-back" onclick="${stStep ? 'stStep--;renderStarQ()' : 'renderStarTest()'}">← ${stStep ? '이전 질문' : '처음으로'}</button>
    </div>`;
}

function answerStar(v) {
  stAnswers[stStep] = v;
  stStep++;
  if (stStep < starQuestions.length) renderStarQ();
  else showStarResult();
}

// 축별 결과: 두 답이 같으면 그대로, 갈리면 전체 A 개수로 판단
function stAxis(i) {
  const x = stAnswers[i * 2], y = stAnswers[i * 2 + 1];
  if (x === y) return x;
  return stAnswers.filter(a => a === 'a').length >= 4 ? 'a' : 'b';
}

function stRecItems(t, dawn) {
  const list = t.preset.all ? ['기본 구성 전체'] : [];
  Object.entries(t.preset.items).forEach(([n, q]) => list.push(q > 1 ? `${n} ×${q}` : n));
  if (!dawn && t.kit === 'custom') list.push('수면 안대 · 귀마개');
  return list;
}

function showStarResult() {
  const [c, o, p, tm] = [0, 1, 2, 3].map(stAxis);
  const key = (c === 'a' ? 'Q' : 'M') + (o === 'a' ? 'J' : 'V') + (p === 'a' ? 'P' : 'N');
  const dawn = tm === 'a';
  const t = starTypes[key], mate = starTypes[t.mate];
  const mod = dawn ? '새벽의' : '한밤의';
  stLast = { key, dawn };

  const tally = stGetTally();
  tally[key] = (tally[key] || 0) + 1;
  stSaveTally(tally);

  const codes = [
    c === 'a' ? '바로바로 청소' : '몰아서 청소',
    o === 'a' ? '제자리 정리' : '보이게 정리',
    p === 'a' ? '계획형 챙김' : '감각형 챙김',
    dawn ? '아침형' : '밤형'
  ];
  const kitName = t.kit === 'custom' ? '커스텀 첫걸음 키트' : '첫걸음 리필 키트';

  stArea().innerHTML = `
    <div class="st-result">
      <div class="st-sky ${dawn ? 'dawn' : 'night'}">
        <div class="label">YOUR DORM CONSTELLATION</div>
        ${stSVG(t)}
        <div class="st-mod">${mod}</div>
        <h2>${t.name}</h2>
        <p class="st-tagline">${t.tagline}</p>
        <div class="st-code">${codes.map(x => `<span>${x}</span>`).join('')}</div>
      </div>
      <div class="st-body">
        <h4>나의 생활 스타일</h4>
        <p>${t.desc} ${dawn ? starTime.dawn : starTime.night}</p>
        <h4>룸메이트 궁합</h4>
        <div class="st-mate">${stSVG(mate)}<div><b>${mod} ${mate.name}</b><p>${t.mateWhy} 생활 시간까지 같다면 기상·소등 리듬이 맞아서 더 편하게 지낼 수 있어요.</p></div></div>
        <h4>info-mile 생활 팁</h4>
        <p>${t.tip}</p>
        <h4>추천 키트 · ${kitName}</h4>
        <div class="st-pills">${stRecItems(t, dawn).map(r => `<span>${r}</span>`).join('')}</div>
        <div class="st-actions">
          <button class="primary hero-primary" onclick="applyStarKit()">추천 키트 담아보기 <span>↗</span></button>
          <button class="textbtn hero-secondary" onclick="startStarTest()">다시 하기</button>
        </div>
        <p class="st-note">✦ 추천 키트는 MILE 홈페이지에서 바로 담아 볼 수 있어요.</p>
      </div>
    </div>`;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 결과의 추천 구성을 MILE 홈페이지의 키트 상세 페이지로 보내기
function applyStarKit() {
  if (!stLast) return;
  const t = starTypes[stLast.key];
  const set = Object.assign({}, t.preset.items);
  if (!stLast.dawn && t.kit === 'custom') set['수면 안대 · 귀마개'] = 1;
  const q = new URLSearchParams({ kit: t.kit, set: 'dorm', all: t.preset.all ? '1' : '0',
    items: Object.entries(set).map(([n, c]) => n + ':' + c).join(','), from: t.name });
  location.href = HOME_URL + '#' + q.toString();
}

renderStarTest();
</script>
</body>
</html>
