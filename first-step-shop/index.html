<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080a1b">
<title>MILE 첫걸음 상점</title>
<style>
:root {
  --bg: #080a1b;
  --bg-2: #0e1131;
  --white: #f5f4ff;
  --muted: #b7bbd5;
  --dim: #7f85b3;
  --lavender: #c5c6ff;
  --blue: #9baeff;
  --pink: #f0c4ff;
  --cyan: #9fe0ff;
  --gold: #ffe6a6;
  --gold-deep: #ffd27a;
  --good: #a9f0cf;
  --bad: #ffb3c1;
  --serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", "Source Han Serif K", serif;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

body {
  margin: 0;
  background: #04050f;
  color: var(--white);
  font-family: var(--sans);
  font-weight: 300;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
svg { display: block; }

/* 세로 화면 기준 게임 판 (360~430px) */
#app {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100%;
  min-height: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(ellipse 80% 40% at 20% 8%, #3b2f8a55, transparent 70%),
    radial-gradient(ellipse 70% 40% at 90% 45%, #2a4aa04a, transparent 70%),
    radial-gradient(ellipse 90% 50% at 50% 105%, #5b3fa040, transparent 70%),
    linear-gradient(180deg, #0a0c22 0%, var(--bg) 55%, #0b0d26 100%);
  box-shadow: 0 0 80px #000;
}

/* 은하수 · 별 · 별똥별 */
.sky { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.milky-way {
  position: absolute;
  left: -40%;
  top: 18%;
  width: 180%;
  height: 26%;
  rotate: -24deg;
  background:
    radial-gradient(ellipse 50% 45% at 50% 50%, #d6ceff38, transparent 70%),
    radial-gradient(ellipse 25% 35% at 32% 55%, #9baeff30, transparent 70%),
    radial-gradient(ellipse 22% 30% at 70% 45%, #f0c4ff28, transparent 70%);
  filter: blur(14px);
  animation: milky 14s ease-in-out infinite alternate;
}

.sky i {
  position: absolute;
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px #dfe3ff;
  animation: twinkle var(--t) ease-in-out var(--d) infinite alternate;
}

.sky i.big::before, .sky i.big::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 9px;
  height: 1px;
  translate: -50% -50%;
  background: linear-gradient(90deg, transparent, #fff, transparent);
}

.sky i.big::after { rotate: 90deg; }

.meteor {
  position: absolute;
  top: 6%;
  left: 110%;
  width: 120px;
  height: 1.5px;
  rotate: -28deg;
  background: linear-gradient(90deg, #fff, #c5c6ff88 25%, transparent);
  box-shadow: 0 0 6px #fff;
  animation: meteor 9s ease-in 3s infinite;
}

.meteor.two { top: 30%; animation-duration: 13s; animation-delay: 8s; }

/* 상단 정보 */
.hud {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: max(12px, env(safe-area-inset-top)) 14px 6px;
}

.day {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 400;
  letter-spacing: -.02em;
  color: var(--white);
}

.day small {
  display: block;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: .16em;
  color: var(--lavender);
}

.stats { display: flex; gap: 6px; }

.stat {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px 5px 7px;
  border-radius: 999px;
  background: #ffffff0d;
  border: 1px solid #dfe3ff26;
  font-size: 12.5px;
}

.stat svg { width: 17px; height: 17px; }
.stat b { font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
.stat.bump { animation: bump .45s; }

.queue {
  position: relative;
  display: flex;
  gap: 5px;
  padding: 2px 14px 0;
}

.queue span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1px solid #c5c6ff66;
}

.queue span.done { background: var(--lavender); box-shadow: 0 0 6px var(--lavender); border-color: transparent; }
.queue span.now { background: var(--gold); box-shadow: 0 0 8px var(--gold); border-color: transparent; }

/* 손님 카운터 */
.counter {
  position: relative;
  height: 214px;
  margin: 8px 12px 0;
  flex-shrink: 0;
}

.glass {
  background: linear-gradient(135deg, #ffffff16, #ffffff06), #0d1030a8;
  border: 1px solid #dce1ff2b;
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: inset 0 1px 0 #ffffff14, 0 14px 40px #02030e66;
}

.bubble {
  position: absolute;
  left: 0;
  right: 104px;
  top: 4px;
  min-height: 116px;
  padding: 13px 15px;
  border-radius: 20px 20px 6px 20px;
  font-family: var(--serif);
  font-size: 14.5px;
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: -.02em;
  word-break: keep-all;
  transition: opacity .3s, transform .3s;
}

.bubble::after {
  content: "";
  position: absolute;
  right: -7px;
  bottom: 16px;
  width: 12px;
  height: 12px;
  rotate: 45deg;
  background: #1a1d45;
  border-top: 1px solid #dce1ff2b;
  border-right: 1px solid #dce1ff2b;
}

.bubble.hide { opacity: 0; transform: translateY(6px) scale(.97); }
.bubble p { margin: 0; }
.bubble.react p { color: var(--gold); }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 5px;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid #f0c4ff66;
  background: #f0c4ff14;
  color: var(--pink);
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 500;
}

.tag:empty { display: none; }

.customer {
  position: absolute;
  right: 0;
  top: 0;
  width: 100px;
  text-align: center;
  transition: transform .5s cubic-bezier(.3,1.35,.5,1), opacity .35s;
}

.customer.out { transform: translateX(130px); opacity: 0; }

.avatar {
  width: 96px;
  height: 108px;
  margin: 0 auto;
  animation: idle 2.6s ease-in-out infinite alternate;
}

.name {
  margin-top: 2px;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

.patience {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 20px;
  height: 8px;
  border-radius: 999px;
  background: #ffffff10;
  border: 1px solid #ffffff1c;
  overflow: hidden;
}

.patience-fill {
  height: 100%;
  width: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--blue), var(--lavender), var(--gold));
  box-shadow: 0 0 12px var(--lavender);
}

.patience-fill.warn { background: linear-gradient(90deg, var(--pink), var(--gold)); box-shadow: 0 0 12px var(--pink); }
.patience-fill.danger { background: linear-gradient(90deg, #ff8fb0, var(--bad)); box-shadow: 0 0 12px #ff8fb0; }

.patience-label {
  position: absolute;
  left: 2px;
  bottom: 0;
  font-size: 10.5px;
  letter-spacing: .04em;
  color: var(--dim);
}

/* 키트 상자 */
.kit {
  position: relative;
  margin: 0 12px;
  padding: 10px 12px 12px;
  border-radius: 20px;
  flex-shrink: 0;
  overflow: hidden;
}

.kit::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 80% 0%, #9baeff26, transparent 60%);
  pointer-events: none;
}

.kit-title {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 400;
}

.kit-title span { font-family: var(--sans); font-size: 10.5px; color: var(--dim); }

.kit-items {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 38px;
  align-content: flex-start;
}

.kit-empty { font-size: 12px; color: var(--dim); align-self: center; }

.kit-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px 5px 5px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
  background: color-mix(in srgb, var(--c) 14%, transparent);
  font-size: 12px;
  font-weight: 400;
  animation: pop .25s ease-out;
}

.kit-chip svg { width: 22px; height: 22px; color: var(--c); filter: drop-shadow(0 0 4px var(--c)); }
.kit-chip .x { color: var(--dim); font-size: 10px; margin-left: 1px; }

/* 버튼 */
.actions {
  display: grid;
  grid-template-columns: .9fr 1.4fr 1.2fr;
  gap: 7px;
  margin: 10px 12px 0;
  flex-shrink: 0;
}

.btn {
  position: relative;
  padding: 12px 6px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  overflow: hidden;
  transition: transform .12s, opacity .2s, box-shadow .2s;
}

.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .38; }

.btn-ghost { background: #ffffff0d; border: 1px solid #dfe3ff30; }
.btn-wrong { background: #f0c4ff14; border: 1px solid #f0c4ff55; color: var(--pink); }

.btn-serve {
  color: #1a1640;
  font-weight: 700;
  background: linear-gradient(135deg, #fff4cf, var(--gold) 45%, var(--gold-deep));
  box-shadow: 0 0 22px #ffe6a666, inset 0 1px 0 #ffffffaa;
}

.btn-serve::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 30%, #ffffffa0 50%, transparent 70%);
  translate: -120% 0;
  animation: shine 3.8s ease-in-out 1s infinite;
}

/* 은하수 진열대 */
.shelf-wrap {
  position: relative;
  flex: 1;
  margin-top: 12px;
  padding: 10px 12px max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid #dce1ff26;
  background:
    linear-gradient(180deg, #ffffff08, transparent 40%),
    radial-gradient(ellipse 80% 60% at 50% 0%, #6e5bd422, transparent 70%);
  overflow-y: auto;
}

.shelf-label {
  display: flex;
  justify-content: space-between;
  margin: 0 2px 8px;
  font-family: var(--serif);
  font-size: 13px;
}

.shelf-label span { font-family: var(--sans); font-size: 10.5px; color: var(--dim); }

.legend { display: flex; gap: 10px; }
.legend b { font-weight: 400; display: inline-flex; align-items: center; gap: 4px; }
.legend b::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }

.shelf {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 9px 3px 8px;
  border-radius: 16px;
  border: 1px solid #ffffff17;
  background: #ffffff07;
  font-size: 11px;
  font-weight: 400;
  line-height: 1.25;
  text-align: center;
  word-break: keep-all;
  transition: transform .15s, border-color .25s, background .25s, box-shadow .25s;
  animation: bob 4s ease-in-out var(--d) infinite alternate;
}

.item .orb {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  color: var(--c);
  background: radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%);
}

.item .orb svg { width: 28px; height: 28px; filter: drop-shadow(0 0 5px var(--c)); }
.item:active { transform: scale(.95); }

.item.in {
  border-color: var(--gold);
  background: #ffe6a614;
  box-shadow: 0 0 18px #ffe6a640, inset 0 0 12px #ffe6a614;
}

.item.in .orb {
  color: #fff8e1;
  background: radial-gradient(circle, #ffe6a6 0%, #ffe6a655 40%, transparent 72%);
}

.item.in .orb svg { filter: drop-shadow(0 0 6px var(--gold)); }

.item.in::after {
  content: "✦";
  position: absolute;
  top: 4px;
  right: 7px;
  font-size: 10px;
  color: var(--gold);
}

.item.locked { opacity: .45; animation: none; }
.item.locked .orb { color: var(--dim); background: none; }
.item.locked .orb svg { filter: none; }

.item.new::before {
  content: "새로 입고";
  position: absolute;
  top: -7px;
  left: 50%;
  translate: -50% 0;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--gold);
  color: #1a1640;
  font-size: 8.5px;
  font-weight: 700;
  white-space: nowrap;
}

/* 알림 */
.toast {
  position: absolute;
  left: 50%;
  top: 74px;
  z-index: 30;
  translate: -50% 0;
  width: max-content;
  max-width: 88%;
  padding: 10px 16px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  word-break: keep-all;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity .25s, transform .25s;
  pointer-events: none;
}

.toast.show { opacity: 1; transform: none; }
.toast .gain { display: block; margin-top: 2px; font-size: 12px; color: var(--gold); font-weight: 400; }

.burst {
  position: absolute;
  z-index: 25;
  color: var(--gold);
  font-size: 13px;
  text-shadow: 0 0 8px currentColor;
  pointer-events: none;
  animation: burst .9s ease-out forwards;
}

/* 안내창 */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: #04050fcc;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

.overlay[hidden] { display: none; }

.card {
  position: relative;
  width: 100%;
  max-height: 100%;
  overflow-y: auto;
  padding: 24px 18px 20px;
  border-radius: 26px;
  text-align: center;
  animation: pop .4s ease-out;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(ellipse at 50% 0%, #8f8cff2e, transparent 60%);
  pointer-events: none;
}

.card > * { position: relative; }

.card h1, .card h2 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -.04em;
  line-height: 1.4;
  word-break: keep-all;
}

.card h1 { font-size: 27px; }
.card h2 { font-size: 22px; }
.card .sub { margin: 8px 0 0; font-size: 13px; color: var(--muted); line-height: 1.7; word-break: keep-all; }
.card .sub b { color: var(--white); font-weight: 500; }
.eyebrow { font-size: 10.5px; letter-spacing: .2em; color: var(--lavender); margin-bottom: 8px; }

.hero-icon { width: 92px; height: 92px; margin: 0 auto 8px; }

.how {
  margin: 16px 0 0;
  padding: 12px 14px;
  border-radius: 16px;
  border: 1px solid #ffffff14;
  background: #ffffff08;
  text-align: left;
  font-size: 12.5px;
  line-height: 1.7;
  list-style: none;
  color: var(--muted);
  word-break: keep-all;
}

.how li::before { content: "✦ "; color: var(--gold); }
.how b { color: var(--white); font-weight: 500; }

.new-items {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  margin-top: 14px;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 14px;
}

.summary div {
  padding: 10px 4px;
  border-radius: 14px;
  border: 1px solid #ffffff14;
  background: #ffffff08;
  font-size: 10.5px;
  color: var(--muted);
}

.summary b { display: block; font-family: var(--serif); font-size: 20px; font-weight: 400; color: var(--gold); }

.card .btn { display: block; width: 100%; margin-top: 16px; padding: 14px; font-size: 14.5px; text-decoration: none; text-align: center; }
.card .btn + .btn { margin-top: 8px; }

/* 자립의 별자리 */
.constellation {
  margin: 14px -4px 0;
  border-radius: 20px;
  border: 1px solid #ffffff14;
  background: radial-gradient(ellipse at 50% 30%, #2a2a6e, #0b0d26 78%);
  overflow: hidden;
}

.constellation svg { width: 100%; height: auto; }

.rank {
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 6px;
  text-align: left;
}

.rank li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px 6px 6px;
  border-radius: 999px;
  border: 1px solid #ffffff14;
  background: #ffffff08;
  font-size: 12.5px;
}

.rank li > span { display: flex; align-items: center; gap: 6px; }
.rank svg { width: 26px; height: 26px; color: var(--c); filter: drop-shadow(0 0 4px var(--c)); }
.rank small { color: var(--gold); }

@keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }
@keyframes milky { from { opacity: .65; translate: -3% 0; } to { opacity: 1; translate: 3% -2%; } }
@keyframes meteor {
  0%, 92% { transform: translateX(0); opacity: 0; }
  93% { opacity: 1; }
  100% { transform: translateX(-560px); opacity: 0; }
}
@keyframes idle { to { transform: translateY(-4px); } }
@keyframes bob { to { translate: 0 -2px; } }
@keyframes pop { from { transform: scale(.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes bump { 50% { transform: scale(1.14); box-shadow: 0 0 16px #ffe6a666; } }
@keyframes shine { 0%, 60% { translate: -120% 0; } 100% { translate: 120% 0; } }
@keyframes burst { from { opacity: 1; transform: translate(0, 0) scale(1); } to { opacity: 0; transform: translate(var(--x), var(--y)) scale(.4); } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes glow { from { opacity: .4; } to { opacity: 1; } }
@keyframes spin { to { rotate: 360deg; } }

.shake { animation: shake .3s; }

@media (max-height: 690px) {
  .counter { height: 192px; }
  .bubble { min-height: 100px; font-size: 13.5px; }
  .avatar { width: 84px; height: 94px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="app">
  <div class="sky" id="sky" aria-hidden="true">
    <div class="milky-way"></div>
    <div class="meteor"></div>
    <div class="meteor two"></div>
  </div>

  <header class="hud">
    <div class="day"><small>MILE FIRST STEP SHOP</small><span id="dayLabel">첫걸음 상점</span></div>
    <div class="stats">
      <div class="stat" id="coinStat"><span id="coinIcon"></span><b id="coins">0</b></div>
      <div class="stat" id="mileStat"><span id="mileIcon"></span><b id="mile">0</b></div>
    </div>
  </header>
  <div class="queue" id="queueInfo" aria-label="남은 손님"></div>

  <section class="counter">
    <div class="bubble glass hide" id="bubble">
      <span class="tag" id="tag"></span>
      <p id="requestText"></p>
    </div>
    <div class="customer out" id="customer">
      <div class="avatar" id="avatar"></div>
      <div class="name" id="custName"></div>
    </div>
    <div class="patience"><div class="patience-fill" id="patienceFill"></div></div>
    <div class="patience-label">기다리는 별빛</div>
  </section>

  <section class="kit glass">
    <div class="kit-title">별빛 키트 상자 <span>담긴 물건을 누르면 빼요</span></div>
    <div class="kit-items" id="kitItems"></div>
  </section>

  <div class="actions">
    <button class="btn btn-ghost" id="clearBtn">비우기</button>
    <button class="btn btn-wrong" id="wrongBtn">이 가게 아니에요!</button>
    <button class="btn btn-serve" id="serveBtn">건네기 ✦</button>
  </div>

  <section class="shelf-wrap">
    <div class="shelf-label">은하수 진열대
      <span class="legend"><b style="--c:var(--blue)">오래 쓰는 물건</b><b style="--c:var(--pink)">소모품</b></span>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>

  <div class="toast glass" id="toast"></div>
  <div class="overlay" id="overlay" hidden><div class="card glass" id="card"></div></div>
</div>

<script>
/* =========================================================

  };

  const renderHud = () => {
    $("coins").textContent = state.coins;
    $("mile").textContent = state.mile;
    $("dayLabel").textContent = ROUNDS[state.round].label;
    $("queueInfo").innerHTML = state.queue.map((_, i) =>
      `<span class="${i < state.index ? "done" : i === state.index && state.running ? "now" : ""}"></span>`).join("");
  };

  const bump = (id) => {
    const el = $(id);
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  };

  let toastTimer;
  const toast = (msg, gain) => {
    const t = $("toast");
    t.innerHTML = msg + (gain ? `<span class="gain">${gain}</span>` : "");
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1700);
  };

  const sparkle = (el, color) => {
    const app = $("app").getBoundingClientRect();
    const r = el.getBoundingClientRect();
    for (let i = 0; i < 9; i++) {
      const s = document.createElement("span");
      s.className = "burst";
      s.textContent = i % 2 ? "✦" : "·";
      const a = Math.random() * Math.PI * 2, d = 24 + Math.random() * 34;
      s.style.cssText = `left:${r.left - app.left + r.width / 2}px;top:${r.top - app.top + r.height / 2}px;color:${color};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d}px`;
      $("app").appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  };

  const setButtons = (on) => {
    ["clearBtn", "wrongBtn", "serveBtn"].forEach(id => $(id).disabled = !on);
  };

  // ── 손님 만들기 ──
  const makeLook = () => ({ color: pick(CUSTOMER_COLORS), hairColor: pick(HAIR_COLORS), hair: Math.floor(Math.random() * 3) });
  const makeName = () => `${200 + Math.floor(Math.random() * 3) * 100 + Math.floor(Math.random() * 12) + 1}호 ${pick(CUSTOMER_NAMES)}`;

  const makeQueue = (roundIndex) => {
    const round = ROUNDS[roundIndex];
    const usable = REQUESTS.filter(r => r.needs.every(id => itemById[id].round <= roundIndex));
    // 새로 들어온 물건을 쓰는 요청이 더 자주 나오도록
    const weighted = usable.flatMap(r => r.needs.some(id => itemById[id].round === roundIndex && roundIndex > 0) ? [r, r] : [r]);
    const queue = [];
    const used = new Set();
    let strange = 0;
    const strangePool = shuffle(STRANGE_REQUESTS);

    for (let n = 0; n < round.customers; n++) {
      const canStrange = !(roundIndex === 0 && n === 0) && strange < MAX_STRANGE_PER_ROUND;
      if (canStrange && Math.random() < STRANGE_CHANCE) {
        strange++;
        queue.push({ strange: true, text: strangePool.pop() || pick(STRANGE_REQUESTS), look: makeLook(), name: makeName() });
        continue;
      }
      let req;
      for (let tries = 0; tries < 20; tries++) {
        req = pick(weighted);
        if (!used.has(req)) break;
      }
      used.add(req);
      queue.push({ ...req, look: makeLook(), name: makeName() });
    }
    return queue;
  };

  // ── 진행 ──
  const showBubble = (text, tag, react) => {
    const b = $("bubble");
    $("requestText").textContent = text;
    $("tag").textContent = tag || "";
    b.classList.toggle("react", !!react);
    b.classList.remove("hide");
  };

  const setMood = (mood) => {
    if (state.mood === mood) return;
    state.mood = mood;
    $("avatar").innerHTML = avatarSVG(state.current.look, mood);
  };

  const nextCustomer = () => {
    if (state.index >= state.queue.length) return endRound();
    const c = state.current = state.queue[state.index];
    state.box = [];
    state.mood = "";
    state.patienceMax = state.patience = ROUNDS[state.round].patience + (c.needs ? (c.needs.length - 1) * 3 : 0);
    setMood("happy");
    $("custName").textContent = c.name;
    $("customer").classList.remove("out");
    showBubble(c.text, c.refill ? "✦ 리필 손님 · 소모품만 찾아요" : "");
    state.running = true;
    renderBox();
    renderHud();
    updatePatience();
    setButtons(true);
  };

  const updatePatience = () => {
    const r = Math.max(state.patience / state.patienceMax, 0);
    const fill = $("patienceFill");
    fill.style.width = `${r * 100}%`;
    fill.classList.toggle("warn", r < .55 && r >= .28);
    fill.classList.toggle("danger", r < .28);
    if (state.running) setMood(r < .28 ? "upset" : r < .55 ? "worry" : "happy");
  };

  const finish = (reaction, coins, mile, gainText, stat, mood) => {
    state.running = false;
    setButtons(false);
    state.coins = Math.max(0, state.coins + coins);
    state.mile = Math.max(0, state.mile + mile);
    state.roundCoins += coins;
    state.roundMile += mile;
    state.roundStats[stat]++;
    setMood(mood);
    showBubble(reaction, "", true);
    toast(gainText.title, gainText.detail);
    if (coins) bump("coinStat");
    if (mile) bump("mileStat");
    if (mile > 0) sparkle($("avatar"), "#ffe6a6");
    renderHud();

    setTimeout(() => {
      $("customer").classList.add("out");
      $("bubble").classList.add("hide");
      setTimeout(() => {
        state.index++;
        nextCustomer();
      }, 450);
    }, 1500);
  };

  const sign = (n) => (n >= 0 ? `+${n}` : `${n}`);

  const serve = () => {
    if (!state.running) return;
    const c = state.current;
    if (!state.box.length) {
      $("kitItems").classList.add("shake");
      setTimeout(() => $("kitItems").classList.remove("shake"), 300);
      return toast("키트 상자가 비어 있어요!");
    }
    state.box.forEach(id => state.picks[id] = (state.picks[id] || 0) + 1);

    if (c.strange) {
      return finish("어… 제가 찾던 건 이게 아닌데요?", 0, -SCORE.mileStrangeWrong,
        { title: "이 손님은 다른 가게를 찾고 있었어요.", detail: `✦ ${sign(-SCORE.mileStrangeWrong)} MILE` }, "wrong", "worry");
    }

    const hits = c.needs.filter(id => state.box.includes(id));
    const miss = c.needs.length - hits.length;
    const extra = state.box.filter(id => !c.needs.includes(id)).length;
    const ratio = state.patience / state.patienceMax;

    if (!miss && !extra) {
      const coins = hits.reduce((a, id) => a + itemById[id].price, 0) + Math.round(SCORE.tipMax * ratio);
      const mile = SCORE.milePerfect + (ratio > .5 ? SCORE.mileFastBonus : 0);
      return finish(pick(["와, 딱 이거예요! 고마워요!", "어떻게 아셨어요? 완벽해요!", "덕분에 오늘 밤은 편하게 지낼 수 있겠어요!"]),
        coins, mile, { title: "딱 맞았어요! ✦", detail: `동전 +${coins} · MILE +${mile}` }, "perfect", "happy");
    }

    const coins = Math.max(0, hits.reduce((a, id) => a + itemById[id].price, 0) - extra * SCORE.extraCost);
    const mile = Math.max(0, hits.length * SCORE.milePerHit - miss * SCORE.milePerMiss - extra * SCORE.milePerExtra);
    const reaction = !hits.length ? "음… 제가 말한 거랑은 좀 다른 것 같아요."
      : miss && extra ? "하나는 빠졌고, 이건 필요 없는데… 그래도 고마워요."
      : miss ? "고마워요! 근데 하나가 빠진 것 같아요…"
      : "필요 없는 것까지 들어 있네요. 그래도 고마워요.";
    const parts = [miss && `빠진 물건 ${miss}개`, extra && `필요 없는 물건 ${extra}개`].filter(Boolean).join(" · ");
    finish(reaction, coins, mile, { title: parts || "조금 아쉬워요.", detail: `동전 +${coins} · MILE +${mile}` }, "partial", hits.length ? "worry" : "upset");
  };

  const rejectCustomer = () => {
    if (!state.running) return;
    const c = state.current;
    if (c.strange) {
      return finish(pick(["앗, 잘못 찾아왔나 봐요! 알려 줘서 고마워요.", "여기가 아니었군요… 다른 데 가 볼게요!"]),
        0, SCORE.mileStrangeRight, { title: "잘 알아봤어요! 여긴 그런 걸 안 팔아요.", detail: `MILE +${SCORE.mileStrangeRight}` }, "strange", "happy");
    }
    finish("네? 분명 여기서 파는 걸로 아는데요…", 0, -SCORE.mileWrongReject,
      { title: "이 손님은 우리 가게 손님이었어요!", detail: `MILE ${sign(-SCORE.mileWrongReject)}` }, "wrong", "upset");
  };

  const timeout = () => {
    const c = state.current;
    if (c.strange) {
      return finish("흠, 여기 아닌가 보네요. 그냥 갈게요.", 0, 0, { title: "엉뚱한 손님이 스스로 떠났어요." }, "strange", "worry");
    }
    finish("너무 오래 걸려서… 다음에 올게요.", 0, -SCORE.mileLeave,
      { title: "손님이 지쳐서 떠났어요.", detail: `MILE ${sign(-SCORE.mileLeave)}` }, "left", "upset");
  };

  // ── 안내창 그림 ──
  const planetSVG = () => `
    <svg class="hero-icon" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <radialGradient id="pl" cx=".35" cy=".3"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#c5b8ff"/><stop offset="1" stop-color="#3a3a8a"/></radialGradient>
        <radialGradient id="plGlow"><stop offset="0" stop-color="#c5c6ff" stop-opacity=".5"/><stop offset="1" stop-color="#c5c6ff" stop-opacity="0"/></radialGradient>
      </defs>
      <circle cx="50" cy="50" r="48" fill="url(#plGlow)"/>
      <ellipse cx="50" cy="54" rx="40" ry="11" fill="none" stroke="#ffe6a6" stroke-opacity=".5" stroke-width="2" transform="rotate(-15 50 54)"/>
      <circle cx="50" cy="50" r="22" fill="url(#pl)"/>
      <path d="M28 60c14 7 34 6 46-4" fill="none" stroke="#ffe6a6" stroke-width="2.2" transform="rotate(-15 50 54)"/>
      <path d="M80 18l1.8 4 4 1.8-4 1.8-1.8 4-1.8-4-4-1.8 4-1.8z" fill="#ffe6a6" style="animation: glow 1.6s ease-in-out infinite alternate"/>
      <path d="M20 22l1 2.2 2.2 1-2.2 1-1 2.2-1-2.2-2.2-1 2.2-1z" fill="#fff" style="animation: glow 2.2s ease-in-out infinite alternate"/>
    </svg>`;

  const moonSVG = (full) => `
    <svg class="hero-icon" viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="mg"><stop offset="0" stop-color="#ffe6a6" stop-opacity=".45"/><stop offset="1" stop-color="#ffe6a6" stop-opacity="0"/></radialGradient></defs>
      <circle cx="50" cy="50" r="46" fill="url(#mg)"/>
      ${full
        ? `<path d="M50 14l7 21.5h22.5L61.3 49l7 21.5L50 57.3 31.7 70.5l7-21.5L20.5 35.5H43z" fill="#ffe6a6" style="filter:drop-shadow(0 0 8px #ffe6a6)"/>`
        : `<path d="M60 20a30 30 0 1 0 20 46 24 24 0 1 1-20-46z" fill="#ffe6a6" style="filter:drop-shadow(0 0 8px #ffe6a6)"/>`}
      <circle cx="22" cy="28" r="1.6" fill="#fff"/><circle cx="80" cy="76" r="1.3" fill="#fff"/><circle cx="76" cy="24" r="1" fill="#fff"/>
    </svg>`;

  // ── 영업 시작 / 마감 ──
  const showCard = (html) => {
    $("card").innerHTML = html;
    $("overlay").hidden = false;
  };

  const hideCard = () => { $("overlay").hidden = true; };

  const startRound = (n) => {
    state.round = n;
    state.queue = makeQueue(n);
    state.index = 0;
    state.roundCoins = 0;
    state.roundMile = 0;
    state.roundStats = { perfect: 0, partial: 0, left: 0, strange: 0, wrong: 0 };
    state.box = [];
    renderBox();
    renderHud();

    const fresh = ITEMS.filter(i => i.round === n);
    showCard(`
      <div class="eyebrow">${ROUNDS[n].label}</div>
      ${n === 0 ? planetSVG() : moonSVG(n === 2)}
      <h2>${n === 0 ? "별빛 상점의 문을 열어요" : n === 1 ? "저녁 별이 뜨고, 손님이 몰려와요" : "마지막 날 밤이에요"}</h2>
      <p class="sub">오늘은 손님 <b>${ROUNDS[n].customers}명</b>이 찾아와요.<br>${n === 0 ? "은하수 진열대에 첫 물건들이 들어왔어요." : "새로운 별이 진열대에 들어왔어요."}</p>
      <div class="new-items">${fresh.map(i => chip(i.id, false)).join("")}</div>
      <button class="btn btn-serve" data-act="open">가게 열기 ✦</button>`);
  };

  const endRound = () => {
    state.running = false;
    renderHud();
    const s = state.roundStats;
    const last = state.round === ROUNDS.length - 1;
    const great = s.perfect >= ROUNDS[state.round].customers - 1;
    showCard(`
      <div class="eyebrow">${ROUNDS[state.round].label} · 마감</div>
      ${moonSVG(great)}
      <h2>${great ? "오늘 장사 아주 잘했어요!" : "오늘도 수고 많았어요"}</h2>
      <div class="summary">
        <div><b>${s.perfect}</b>딱 맞게</div>
        <div><b>${s.partial}</b>조금 아쉽게</div>
        <div><b>${s.left}</b>떠난 손님</div>
      </div>
      <p class="sub">이번 영업으로 동전 <b>${sign(state.roundCoins)}</b>, MILE <b>${sign(state.roundMile)}</b>을 모았어요.${s.strange ? `<br>엉뚱한 손님 ${s.strange}명도 잘 돌려보냈어요.` : ""}</p>
      <button class="btn btn-serve" data-act="${last ? "final" : "next"}">${last ? "자립의 별자리 보기 ✦" : "다음 영업 준비하기"}</button>`);
  };

  const constellationSVG = (lit) => {
    const pts = [[48, 150], [118, 100], [196, 128], [262, 50]];
    const band = `<path d="M-20 190 C 80 120, 200 140, 330 20" stroke="#d6ceff" stroke-opacity=".12" stroke-width="44" fill="none" style="filter:blur(8px)"/>`;
    const lines = pts.slice(1).map((p, i) => {
      const a = pts[i];
      const on = i + 1 < lit;
      return `<line x1="${a[0]}" y1="${a[1]}" x2="${p[0]}" y2="${p[1]}" stroke="${on ? "#ffe6a6" : "#ffffff"}" stroke-opacity="${on ? .75 : .16}" stroke-width="1.6" ${on ? "" : 'stroke-dasharray="3 5"'}/>`;
    }).join("");
    const star = (x, y, r) => `M${x} ${y - r}C${x + r * .18} ${y - r * .18} ${x + r * .18} ${y - r * .18} ${x + r} ${y}C${x + r * .18} ${y + r * .18} ${x + r * .18} ${y + r * .18} ${x} ${y + r}C${x - r * .18} ${y + r * .18} ${x - r * .18} ${y + r * .18} ${x - r} ${y}C${x - r * .18} ${y - r * .18} ${x - r * .18} ${y - r * .18} ${x} ${y - r}z`;
    const stars = pts.map(([x, y], i) => {
      const on = i < lit;
      return `<g>
        ${on ? `<circle cx="${x}" cy="${y}" r="24" fill="#ffe6a6" opacity=".22" style="animation: glow ${1.4 + i * .3}s ease-in-out infinite alternate"/>` : ""}
        <path d="${star(x, y, on ? 13 : 8)}" fill="${on ? "#ffe6a6" : "#5d6496"}" ${on ? 'style="filter:drop-shadow(0 0 6px #ffe6a6)"' : ""}/>
        <text x="${x}" y="${y + 30}" text-anchor="middle" font-size="11" font-family="Noto Serif KR, serif" fill="${on ? "#fff3c4" : "#7d84b8"}">${STAR_NAMES[i]}</text>
      </g>`;
    }).join("");
    const dust = Array.from({ length: 36 }, () =>
      `<circle cx="${(Math.random() * 310).toFixed(0)}" cy="${(Math.random() * 200).toFixed(0)}" r="${(Math.random() * 1.1 + .3).toFixed(1)}" fill="#fff" opacity="${(Math.random() * .5 + .2).toFixed(2)}"/>`).join("");
    return `<svg viewBox="0 0 310 200" role="img" aria-label="별 ${lit}개가 켜진 자립의 별자리">${band}${dust}${lines}${stars}</svg>`;
  };

  const showFinal = () => {
    const lit = 1 + STAR_THRESHOLDS.filter(t => state.mile >= t).length;
    const top = Object.entries(state.picks).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const messages = [
      "첫 별이 켜졌어요. 시작이 반이에요!",
      "별 두 개가 이어졌어요. 생활이 조금씩 자리를 잡고 있어요.",
      "별 세 개! 이제 스스로 꾸려 가는 하루가 익숙해졌어요.",
      "별자리가 완성됐어요! 자립을 향한 첫걸음, 정말 멋졌어요."
    ];
    showCard(`
      <div class="eyebrow">2일 영업 끝</div>
      <h2>자립으로 가는 별자리</h2>
      <div class="constellation">${constellationSVG(lit)}</div>
      <p class="sub"><b>${messages[lit - 1]}</b></p>
      <div class="summary">
        <div><b>${state.mile}</b>총 MILE</div>
        <div><b>${state.coins}</b>모은 동전</div>
        <div><b>${lit}/4</b>켜진 별</div>
      </div>
      <p class="sub" style="margin-top:14px">가장 많이 담은 물건</p>
      <ol class="rank">${top.length
        ? top.map(([id, n], i) => `<li style="--c:${colorOf(id)}"><span>${icon(itemById[id].icon)}${i + 1}. ${itemById[id].name}</span><small>${n}번</small></li>`).join("")
        : `<li><span>아직 담은 물건이 없어요</span></li>`}</ol>
      <a class="btn btn-serve" href="${MILE_LINK}" target="_blank" rel="noopener noreferrer">MILE 더 알아보기 ↗</a>
      <button class="btn btn-ghost" data-act="restart">처음부터 다시 하기</button>`);
  };

  const showTitle = () => {
    showCard(`
      <div class="eyebrow">MILE FIRST STEP SHOP</div>
      ${planetSVG()}
      <h1>MILE 첫걸음 상점</h1>
      <p class="sub">은하수 기숙사의 학생들이 필요한 걸 찾아와요.<br>말 속에 숨은 힌트를 듣고, 딱 맞는 별빛 키트를 꾸려 주세요.</p>
      <ul class="how">
        <li>진열대의 물건을 눌러 키트 상자에 담아요.</li>
        <li>다 담았으면 <b>건네기</b>를 눌러요. 딱 맞을수록 동전과 MILE을 많이 받아요.</li>
        <li>너무 늦으면 손님이 떠나요. <b>기다리는 별빛</b>을 잘 봐 주세요.</li>
        <li><b>리필 손님</b>은 소모품만 찾아요.</li>
        <li>가게에 없는 걸 찾는 손님은 <b>이 가게 아니에요!</b>로 돌려보내요.</li>
      </ul>
      <button class="btn btn-serve" data-act="start">시작하기 ✦</button>`);
  };

  // ── 입력 (탭만 사용) ──
  $("shelf").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]");
    if (!b || !state.running) return;
    const id = b.dataset.id;
    if (!unlocked(id)) return toast("아직 입고 전이에요. 조금만 기다려 주세요!");
    const at = state.box.indexOf(id);
    if (at >= 0) state.box.splice(at, 1);
    else {
      state.box.push(id);
      sparkle(b, colorOf(id));
    }
    renderBox();
  });

  $("kitItems").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]");
    if (!b || !state.running) return;
    state.box.splice(state.box.indexOf(b.dataset.id), 1);
    renderBox();
  });

  $("clearBtn").addEventListener("click", () => { if (state.running) { state.box = []; renderBox(); } });
  $("serveBtn").addEventListener("click", serve);
  $("wrongBtn").addEventListener("click", rejectCustomer);

  $("overlay").addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    if (act === "start") startRound(0);
    else if (act === "open") { hideCard(); setTimeout(nextCustomer, 250); }
    else if (act === "next") startRound(state.round + 1);
    else if (act === "final") showFinal();
    else if (act === "restart") {
      Object.assign(state, { coins: 0, mile: 0, picks: {} });
      startRound(0);
    }
  });

  // ── 기다림 타이머 ──
  let last = performance.now();
  const loop = (now) => {
    const dt = Math.min((now - last) / 1000, .1);
    last = now;
    if (state.running) {
      state.patience -= dt;
      updatePatience();
      if (state.patience <= 0) timeout();
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);

  setButtons(false);
  renderShelf();
  renderBox();
  renderHud();
  showTitle();
})();
</script>
</body>
</html>
